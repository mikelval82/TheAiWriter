- nombre: Tesis clara y relevante
  descripcion: El documento formula una tesis reconocible y explica por qué importa para el campo. La mantiene como hilo conductor del ensayo.
- nombre: Argumento sólido y apoyado en la literatura
  descripcion: El razonamiento conecta las afirmaciones con la literatura consultada y justifica los pasos hasta la tesis. Distingue lo que aportan las fuentes de la interpretación del autor.
- nombre: Objeciones y límites considerados
  descripcion: Examina las objeciones plausibles y delimita el alcance del argumento. Reconoce incertidumbres y limitaciones sin ocultarlas.
- nombre: Aportación respecto a lo publicado
  descripcion: Explica qué añade la perspectiva frente a las interpretaciones ya publicadas. Sitúa su propuesta en la literatura sin exagerar su novedad.
- nombre: Estructura y claridad
  descripcion: Las secciones construyen el argumento en un orden comprensible y evitan repeticiones innecesarias. Los conceptos y las transiciones permiten seguir la tesis.
