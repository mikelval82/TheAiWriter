[project]
name = "ai-writer"
version = "1.0.0"
description = "AI-powered academic paper writing assistant specialized in perspective papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "markdown>=3.5.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastembed>=0.7",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
    "bibtexparser>=1.4,<2",
]

[project.scripts]
ai-writer = "ai_writer.main:main"
theaiwriter-mcp = "ai_writer.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_writer", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
